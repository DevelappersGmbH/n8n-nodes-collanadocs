<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 60 60" width="60" height="60">
  <title>Collana Docs</title>
  <defs>
    <!-- Stanzt den Bereich um den Funken aus der Seite heraus, damit der
         Akzent auch bei kleiner Darstellung freisteht. -->
    <mask id="collanaDocsSparkGapDark">
      <rect width="60" height="60" fill="#fff"/>
      <path fill="#000"
            d="M45.5 29c1.7 8.9 3.6 10.8 12.5 12.5C49.1 43.2 47.2 45.1 45.5 54c-1.7-8.9-3.6-10.8-12.5-12.5C41.9 39.8 43.8 37.9 45.5 29z"/>
    </mask>
  </defs>

  <g mask="url(#collanaDocsSparkGapDark)">
    <!-- Auf dunklem Grund trägt Collanas Orange etwas heller, sonst sackt
         es gegen den Hintergrund ab. -->
    <path fill="#FF6A2B"
          d="M15 3h17.5L45 15.5V54a3 3 0 0 1-3 3H15a3 3 0 0 1-3-3V6a3 3 0 0 1 3-3z"/>
    <path fill="#C9430F" d="M32.5 3 45 15.5H34.5a2 2 0 0 1-2-2V3z"/>
    <g fill="#FFFFFF">
      <rect x="18" y="25" width="21" height="3.4" rx="1.7"/>
      <rect x="18" y="32" width="21" height="3.4" rx="1.7"/>
      <rect x="18" y="39" width="13" height="3.4" rx="1.7"/>
    </g>
  </g>

  <!-- Ebenfalls aufgehellt, damit der Funke gegen Dunkelgrau nicht zuläuft. -->
  <path fill="#63C7C7"
        d="M45.5 33c1.4 6.9 2.8 8.3 9.7 9.7-6.9 1.4-8.3 2.8-9.7 9.7-1.4-6.9-2.8-8.3-9.7-9.7 6.9-1.4 8.3-2.8 9.7-9.7z"/>
</svg>
